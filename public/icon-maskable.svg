<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: important content within 409x409 safe zone centred at 256,256 -->
  <title>Inclu.si maskable</title>
  <!-- Full bleed indigo background required for maskable -->
  <rect width="512" height="512" fill="#4f46e5"/>
  <!-- Content inside safe zone (40% padding each side = 102px inset, so 308px wide) -->
  <circle cx="256" cy="140" r="32" fill="#ffffff"/>
  <line x1="256" y1="175" x2="256" y2="278" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="278" x2="204" y2="358" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="278" x2="308" y2="358" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="210" x2="192" y2="242" stroke="#a5b4fc" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="210" x2="328" y2="182" stroke="#a5b4fc" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="390" r="14" fill="#c7d2fe"/>
</svg>
