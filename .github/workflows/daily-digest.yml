name: Daily Accessibility Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily digest
        shell: bash
        run: |
          set -o pipefail
          npm run news:digest 2>&1 | tee digest.log
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}

      - name: Upload digest log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-log-${{ github.run_id }}
          path: digest.log
          if-no-files-found: warn

      - name: Commit digest output
        run: |
          if git diff --quiet; then
            echo "No digest updates"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/daily-digest.json
            git commit -m "chore: generate daily digest"
            git push
          fi
