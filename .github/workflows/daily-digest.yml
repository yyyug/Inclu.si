name: Daily Accessibility Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily digest
        id: daily_digest
        shell: bash
        run: |
          set -o pipefail
          npm run news:digest 2>&1 | tee digest.log
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: nemotron-3-super:cloud
          OLLAMA_MAX_TOKENS: 10240
          OLLAMA_TIMEOUT_MS: 300000
          OLLAMA_MAX_RETRIES: 5
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_TIMEOUT_MS: 300000
          DIGEST_LOOKBACK_HOURS: 24

      - name: Deploy to Cloudflare Pages
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f12f219ab9cf823c47c1e01a463d67a6
        run: |
          node scripts/gen-homepages.mjs
          npx wrangler pages deploy dist --project-name inclu-si --branch main

      - name: Upload digest log artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: digest-log-${{ github.run_id }}
          path: digest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Build concise run summary
        if: always()
        shell: bash
        env:
          OLLAMA_TIMEOUT_MS: 300000
          OLLAMA_MAX_RETRIES: 5
        run: |
          {
            echo "workflow: daily-digest"
            echo "run_id: ${{ github.run_id }}"
            echo "run_attempt: ${{ github.run_attempt }}"
            echo "job_status: ${{ job.status }}"
            echo "ref: ${{ github.ref_name }}"
            echo "sha: ${{ github.sha }}"
            echo "generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "ollama_timeout_ms: ${OLLAMA_TIMEOUT_MS}"
            echo "ollama_max_retries: ${OLLAMA_MAX_RETRIES}"
            if [ -f digest.log ]; then
              echo "log_tail:"
              tail -n 60 digest.log
            else
              echo "log_tail: digest.log not found"
            fi
          } > digest-summary.txt

      - name: Upload concise run summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: digest-summary-${{ github.run_id }}
          path: digest-summary.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit digest output
        if: always()
        run: |
          if git diff --quiet src/data/daily-digest.json; then
            echo "No digest updates"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/daily-digest.json
            git commit -m "chore: generate daily digest"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
            done
            echo "Failed to push changes after retries"
            exit 1
          fi

      - name: Report step outcomes
        if: always()
        shell: bash
        run: |
          echo "daily_digest=${{ steps.daily_digest.outcome }}"
