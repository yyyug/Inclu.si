name: 4-Hour Ingest Accessibility News

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, generate, and cluster stories
        shell: bash
        run: |
          set -o pipefail
          npm run news:ingest 2>&1 | tee ingest.log
          npm run news:cluster 2>&1 | tee -a ingest.log
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: nemotron-3-super:cloud
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_BASE_URL: https://newsapi.org/v2/everything
          GOOGLE_NEWS_RSS_URLS: >-
            https://news.google.com/rss/search?q=accessibility&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=%E7%84%A1%E9%9A%9C%E7%A4%99&hl=zh-TW&gl=TW&ceid=TW:zh-Hant,https://news.google.com/rss/search?q=%EC%9E%A5%EC%95%A0%EC%9D%B8+%EC%A0%91%EA%B7%BC%EC%84%B1&hl=ko&gl=KR&ceid=KR:ko,https://news.google.com/rss/search?q=%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B7%E3%83%93%E3%83%AA%E3%83%86%E3%82%A3&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%E3%83%90%E3%83%AA%E3%82%A2%E3%83%95%E3%83%AA%E3%83%BC&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%E9%9A%9C%E5%AE%B3%E8%80%85+%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B7%E3%83%93%E3%83%AA%E3%83%86%E3%82%A3&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%A5%D8%B9%D8%A7%D9%82%D8%A9&hl=ar&gl=SA&ceid=SA:ar,https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%A5%D8%B9%D8%A7%D9%82%D8%A9&hl=ar&gl=AE&ceid=AE:ar
          NEWS_API_QUERIES: accessibility,無障礙,접근성,アクセシビリティ,الإعاقة
          NEWS_API_PAGE_SIZE: 50
          MAX_ITEMS_PER_RUN: 20
          BATCH_SIZE: 3
          CLUSTER_SIMILARITY_THRESHOLD: 0.72
          CLUSTER_MAX_HOURS_DIFF: 36

      - name: Upload ingest log artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ingest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit generated content
        run: |
          if git diff --quiet src/data/news; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/news
            git commit -m "chore: ingest accessibility news"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
            done
            echo "Failed to push changes after retries"
            exit 1
          fi
