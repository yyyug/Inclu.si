name: Twice-Daily Ingest Accessibility News

on:
  workflow_dispatch:
  schedule:
    - cron: "12 0,12 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, generate, and cluster stories
        id: news_ingest
        shell: bash
        run: |
          set -o pipefail
          npm run news:ingest 2>&1 | tee ingest.log
          npm run news:cluster 2>&1 | tee -a ingest.log
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: nemotron-3-super:cloud
          OLLAMA_MAX_TOKENS: 4096
          OLLAMA_TIMEOUT_MS: 180000
          OLLAMA_MAX_RETRIES: 3
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_TIMEOUT_MS: 300000
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_BASE_URL: https://newsapi.org/v2/everything
          GOOGLE_NEWS_RSS_URLS: >-
            https://news.google.com/rss/search?q=accessibility&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=%E7%84%A1%E9%9A%9C%E7%A4%99&hl=zh-TW&gl=TW&ceid=TW:zh-Hant,https://news.google.com/rss/search?q=%EC%9E%A5%EC%95%A0%EC%9D%B8+%EC%A0%91%EA%B7%BC%EC%84%B1&hl=ko&gl=KR&ceid=KR:ko,https://news.google.com/rss/search?q=%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B7%E3%83%93%E3%83%AA%E3%83%86%E3%82%A3&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%E3%83%90%E3%83%AA%E3%82%A2%E3%83%95%E3%83%AA%E3%83%BC&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%E9%9A%9C%E5%AE%B3%E8%80%85+%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B7%E3%83%93%E3%83%AA%E3%83%86%E3%82%A3&hl=ja&gl=JP&ceid=JP:ja,https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%A5%D8%B9%D8%A7%D9%82%D8%A9&hl=ar&gl=SA&ceid=SA:ar,https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%A5%D8%B9%D8%A7%D9%82%D8%A9&hl=ar&gl=AE&ceid=AE:ar,https://www.disabled-world.com/news.xml,https://disabilityinsider.com/feed/,https://www.theguardian.com/world/disability/rss,https://www.edf-feph.org/feed/
          NEWS_API_QUERIES: accessibility,無障礙,접근성,アクセシビリティ,الإعاقة
          NEWS_API_PAGE_SIZE: 50
          MAX_ITEMS_PER_RUN: 20
          BATCH_SIZE: 3
          CLUSTER_SIMILARITY_THRESHOLD: 0.72
          CLUSTER_MAX_HOURS_DIFF: 36

      - name: Upload ingest log artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ingest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit generated content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "COMMITTED_YES_NO=no" >> "$GITHUB_ENV"
          else
            for attempt in 1 2 3; do
              git reset HEAD~1 --soft 2>/dev/null || true
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git add src/data/news
              git commit -m "chore: ingest accessibility news"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "COMMITTED_YES_NO=yes" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
            done
            echo "Failed to push changes after retries"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f12f219ab9cf823c47c1e01a463d67a6
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name inclu-si --branch main

      - name: Report step outcomes
        if: always()
        shell: bash
        run: |
          echo "news_ingest=${{ steps.news_ingest.outcome }}"

      - name: Build concise run summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          OLLAMA_TIMEOUT_MS: 180000
          OLLAMA_MAX_RETRIES: 3
        run: |
          if [ -f ingest.log ]; then
            rss_returned=$(grep -Eo '\[news\] rss_candidates=[0-9]+' ingest.log | tail -1 | cut -d= -f2)
            newsapi_returned=$(grep -Eo '\[news\] newsapi_candidates=[0-9]+' ingest.log | tail -1 | cut -d= -f2)
          else
            rss_returned="n/a"
            newsapi_returned="n/a"
          fi

          rss_returned=${rss_returned:-n/a}
          newsapi_returned=${newsapi_returned:-n/a}

          {
            echo "workflow=news-ingest"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "job_status=${{ job.status }}"
            echo "ref=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "ollama_timeout_ms=${OLLAMA_TIMEOUT_MS}"
            echo "ollama_max_retries=${OLLAMA_MAX_RETRIES}"
            echo "rss_returned=${rss_returned}"
            echo "newsapi_returned=${newsapi_returned}"
            echo "tweets_returned=n/a"
            echo "facebook_returned=n/a"
            echo "committed_yes_no=${COMMITTED_YES_NO:-no}"
            if [ -f ingest.log ]; then
              echo "log_tail:"
              tail -n 60 ingest.log
            else
              echo "log_tail=ingest.log not found"
            fi
          } > ingest-summary.txt

      - name: Upload concise run summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary-${{ github.run_id }}
          path: ingest-summary.txt
          if-no-files-found: ignore
          retention-days: 2
