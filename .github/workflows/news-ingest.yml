name: Hourly Ingest Accessibility News

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, generate, and cluster stories
        shell: bash
        run: |
          set -o pipefail
          npm run news:ingest 2>&1 | tee ingest.log
          npm run news:cluster 2>&1 | tee -a ingest.log
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          GOOGLE_NEWS_RSS_URL: https://news.google.com/rss/search?q=accessibility&hl=en-US&gl=US&ceid=US:en
          MAX_ITEMS_PER_RUN: 8
          BATCH_SIZE: 3
          CLUSTER_SIMILARITY_THRESHOLD: 0.72
          CLUSTER_MAX_HOURS_DIFF: 36

      - name: Upload ingest log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ingest.log
          if-no-files-found: warn

      - name: Commit generated content
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/news
            git commit -m "chore: ingest accessibility news"
            git push
          fi
