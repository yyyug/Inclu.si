name: Daily Ingest A11y Tweets

on:
  workflow_dispatch:
  schedule:
    - cron: "42 0,12 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR_ID: kaitoeasyapi/twitter-x-data-tweet-scraper-pay-per-result-cheapest
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_FACEBOOK_DATASET_ID: gd_lkaxegm826bjpoo9m5
      BRIGHTDATA_FACEBOOK_PAGE_URL: https://www.facebook.com/silence.deaf/
      BRIGHTDATA_FACEBOOK_WINDOW_HOURS: 24
      BRIGHTDATA_FACEBOOK_MAX_POSTS: 3
      BRIGHTDATA_TIMEOUT_MS: 240000
      BRIGHTDATA_MAX_RETRIES: 3
      BRIGHTDATA_POLL_INTERVAL_MS: 30000
      BRIGHTDATA_MAX_POLL_ATTEMPTS: 20
      A11Y_TWEET_DEBUG: 1
      A11Y_TWEET_QUERY: ""
      A11Y_TWEET_KEYWORDS: a11y,accessibility,inclusion,アクセシビリティ,バリアフリー,障害者,共生,インクルーシブ,ウェブアクセシビリティ,ユニバーサルデザイン,GAAD
      A11Y_TWEET_ACCOUNTS: BlindNewWorld,UCBInfo,makoto_ueki,bakera,magi1125,momdo_,A11yTYO,waic_jp,porta11y,NPOJD,DPIJAPAN,AccessibleJapan,rouarenmei,seinenkyou
      A11Y_TWEET_WINDOW_HOURS: 24
      A11Y_TWEET_MAX_ITEMS: 50
      A11Y_TWEET_LANGUAGES: en,zh,ja,ko
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: nemotron-3-super:cloud
      OLLAMA_MAX_TOKENS: 4096
      OLLAMA_TIMEOUT_MS: 180000
      OLLAMA_MAX_RETRIES: 3
      BATCH_SIZE: 5
      CLUSTER_SIMILARITY_THRESHOLD: 0.72
      CLUSTER_MAX_HOURS_DIFF: 36

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch a11y tweets
        id: tweets_ingest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run tweets:ingest 2>&1 | tee tweets-ingest.log

      - name: Fetch facebook signals
        id: facebook_ingest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run facebook:ingest 2>&1 | tee -a tweets-ingest.log

      - name: Cluster stories
        id: cluster_ingest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run news:cluster 2>&1 | tee -a tweets-ingest.log

      - name: Upload tweet ingest log artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tweet-ingest-log-${{ github.run_id }}
          path: tweets-ingest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload run summary artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tweet-ingest-summary-${{ github.run_id }}
          path: tweets-ingest-summary.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit generated content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "COMMITTED_YES_NO=no" >> "$GITHUB_ENV"
          else
            for attempt in 1 2 3; do
              git reset HEAD~1 --soft 2>/dev/null || true
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git add src/data/news
              git commit -m "chore: ingest a11y social signals"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "COMMITTED_YES_NO=yes" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
            done
            echo "Failed to push changes after retries"
            exit 1
          fi

      - name: Report step outcomes
        if: always()
        shell: bash
        run: |
          echo "tweets_ingest=${{ steps.tweets_ingest.outcome }}"
          echo "facebook_ingest=${{ steps.facebook_ingest.outcome }}"
          echo "cluster_ingest=${{ steps.cluster_ingest.outcome }}"

      - name: Build concise run summary
        if: always()
        shell: bash
        run: |
          tweets_returned=$(grep -Eo 'Done\. New tweet stories: [0-9]+' tweets-ingest.log | tail -1 | awk '{print $5}')
          facebook_returned=$(grep -Eo '\[facebook\] Done\. New stories: [0-9]+' tweets-ingest.log | tail -1 | awk '{print $5}')
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "job_status=success"
            echo "tweets_returned=${tweets_returned:-0}"
            echo "facebook_returned=${facebook_returned:-0}"
            echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > tweets-ingest-summary.txt

      - name: Final ingest gate
        if: always()
        shell: bash
        run: |
          echo "tweets_ingest=${{ steps.tweets_ingest.outcome }}"
          echo "facebook_ingest=${{ steps.facebook_ingest.outcome }}"
          echo "cluster_ingest=${{ steps.cluster_ingest.outcome }}"

          if [ "${{ steps.facebook_ingest.outcome }}" = "failure" ]; then
            echo "Facebook provider ingest failed but is isolated from tweet ingest gate."
          fi

          if [ "${{ steps.tweets_ingest.outcome }}" = "failure" ] || [ "${{ steps.cluster_ingest.outcome }}" = "failure" ]; then
            echo "Failing run because core ingest/cluster steps failed."
            exit 1
          fi
