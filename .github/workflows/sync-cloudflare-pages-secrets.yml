name: Sync Cloudflare Pages Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-pages-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push RESEND, BRIGHTDATA and TURNSTILE secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: f12f219ab9cf823c47c1e01a463d67a6
          CLOUDFLARE_PAGES_PROJECT: inclu-si
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "Missing required GitHub secret: RESEND_API_KEY"
            exit 1
          fi
          if [ -z "${BRIGHTDATA_API_KEY:-}" ]; then
            echo "Missing required GitHub secret: BRIGHTDATA_API_KEY"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_TURNSTILE_SECRET_KEY"
            exit 1
          fi

          echo "RESEND_API_KEY length=${#RESEND_API_KEY}"
          echo "BRIGHTDATA_API_KEY length=${#BRIGHTDATA_API_KEY}"
          echo "CLOUDFLARE_TURNSTILE_SECRET_KEY length=${#CLOUDFLARE_TURNSTILE_SECRET_KEY}"
          if [ "${#RESEND_API_KEY}" -lt 10 ]; then
            echo "RESEND_API_KEY appears too short"
            exit 1
          fi

          payload=$(cat <<JSON
          {
            "deployment_configs": {
              "preview": {
                "env_vars": {
                  "RESEND_API_KEY": { "type": "secret_text", "value": "${RESEND_API_KEY}" },
                  "BRIGHTDATA_API_KEY": { "type": "secret_text", "value": "${BRIGHTDATA_API_KEY}" },
                  "CLOUDFLARE_TURNSTILE_SECRET_KEY": { "type": "secret_text", "value": "${CLOUDFLARE_TURNSTILE_SECRET_KEY}" }
                }
              },
              "production": {
                "env_vars": {
                  "RESEND_API_KEY": { "type": "secret_text", "value": "${RESEND_API_KEY}" },
                  "BRIGHTDATA_API_KEY": { "type": "secret_text", "value": "${BRIGHTDATA_API_KEY}" },
                  "CLOUDFLARE_TURNSTILE_SECRET_KEY": { "type": "secret_text", "value": "${CLOUDFLARE_TURNSTILE_SECRET_KEY}" }
                }
              }
            }
          }
          JSON
          )

          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            | tee sync-response.json

          jq -e '.success == true' sync-response.json >/dev/null
          echo "Cloudflare Pages secrets synced successfully."
