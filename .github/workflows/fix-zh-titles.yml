name: Fix zh-TW Titles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix untranslated zh-TW titles
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: nemotron-3-super:cloud
          OLLAMA_TIMEOUT_MS: 120000
        run: node scripts/fix-zh-titles.mjs

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: retranslate untranslated zh-TW titles"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
            done
            echo "Failed to push changes after retries"
            exit 1
          fi
